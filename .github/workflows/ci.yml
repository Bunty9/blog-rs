name: ci
on: [push, pull_request]
jobs:
  rust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with: { components: "rustfmt, clippy, llvm-tools-preview" }
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: taiki-e/install-action@cargo-llvm-cov
      - name: Coverage
        run: cargo llvm-cov --workspace --fail-under-lines 70
  e2e:
    runs-on: ubuntu-latest
    needs: rust
    env:
      E2E_PROFILE: release
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with: { node-version: '22' }
      - run: cargo build --release -p blog-rs
      - run: npm ci --prefix tests/e2e
      - run: npx --prefix tests/e2e playwright install --with-deps chromium
      - run: npx --prefix tests/e2e playwright test
