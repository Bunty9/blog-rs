{% if revisions.is_empty() %}
<p class="meta" style="margin:0">No revisions yet — one is saved automatically before publish, and periodically while editing.</p>
{% else %}
<ul style="list-style:none; margin:0; padding:0; display:flex; flex-direction:column; gap:var(--space-2)">
    {% for rev in revisions %}
    <li style="display:flex; align-items:center; justify-content:space-between; gap:var(--space-2); font-size:0.85rem; border:1px solid var(--border); border-radius:var(--r-sm); padding:6px 8px">
        <div style="min-width:0">
            <div style="overflow:hidden; text-overflow:ellipsis; white-space:nowrap">{{ rev.title }}</div>
            <div class="help" style="font-size:0.72rem">{{ rev.created_at_display }} · {{ rev.body_size|filesizeformat }}</div>
        </div>
        <button type="button" class="btn btn-ghost btn-sm"
                hx-post="/admin/posts/{{ post_id }}/revisions/{{ rev.id }}/restore"
                hx-sync="#editor:queue all"
                hx-confirm="Restore this revision? The current content will be saved as a new revision first.">Restore</button>
    </li>
    {% endfor %}
</ul>
{% endif %}
