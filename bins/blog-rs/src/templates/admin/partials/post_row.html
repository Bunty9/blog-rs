<tr id="post-row-{{ row.id }}">
    <td><a class="t-title" href="/admin/posts/{{ row.id }}">{{ row.title }}</a></td>
    <td><code>{{ row.slug }}</code></td>
    <td><span class="badge {{ row.status }}">{{ row.status }}</span></td>
    <td><span class="meta">{{ row.updated_at }}</span></td>
    <td>
        <div class="row-actions">
            <a class="icon-btn" href="/admin/posts/{{ row.id }}" title="Edit">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4z"/></svg>
            </a>
            <form method="post" action="/admin/posts/{{ row.id }}/delete"
                  onsubmit="return confirm('Delete this post?')"
                  style="display:inline">
                <input type="hidden" name="csrf_token" value="{{ csrf }}" />
                <button class="icon-btn" type="submit" title="Delete">
                    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4h8v2M19 6l-1 14H6L5 6"/></svg>
                </button>
            </form>
        </div>
    </td>
</tr>
