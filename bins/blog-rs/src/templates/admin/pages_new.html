{% extends "admin/base.html" %}
{% block title %}New page · blog-rs{% endblock %}
{% block content %}
<h2>New page</h2>

<p>Create a blank draft page. You can fill in title, body, and metadata on the next screen.</p>

<form method="post" action="/admin/pages/new">
    <input type="hidden" name="csrf_token" value="{{ csrf }}" />
    <button class="btn primary" type="submit">Create page</button>
    <a class="btn" href="/admin/pages">Cancel</a>
</form>
{% endblock %}
