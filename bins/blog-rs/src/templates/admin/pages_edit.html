{% extends "admin/base.html" %}
{% block title %}Edit · {{ title }}{% endblock %}
{% block content %}
<h2 style="display:flex;justify-content:space-between;align-items:center;">
    <span>Edit page</span>
    <span><a class="btn" href="/admin/pages">Back to list</a></span>
</h2>

<div id="flash-slot"></div>

<form id="editor"
      hx-post="/admin/pages/{{ id }}"
      hx-trigger="change delay:500ms from:closest form"
      hx-target="#flash-slot"
      hx-swap="innerHTML"
      hx-include="closest form">
    <input type="hidden" name="csrf_token" value="{{ csrf }}" />

    <div class="editor-grid">
        <div class="editor-pane">
            <div class="field">
                <label for="title">Title</label>
                <input id="title" name="title" type="text" value="{{ title }}" />
            </div>
            <div class="field">
                <label for="slug">Slug</label>
                <input id="slug" name="slug" type="text" value="{{ slug }}" />
            </div>
            <div class="field">
                <label for="status">Status</label>
                <select id="status" name="status">
                    <option value="draft"     {% if status == "draft" %}selected{% endif %}>Draft</option>
                    <option value="published" {% if status == "published" %}selected{% endif %}>Published</option>
                </select>
            </div>
            <div class="field">
                <label for="body-md">Body (markdown + shortcodes)</label>
                <textarea id="body-md" name="body_md" rows="20">{{ body_md }}</textarea>
            </div>
        </div>

        <div class="preview-pane">
            <h3 style="margin-top:0;">Preview</h3>
            <div id="preview">
                {{ body_html|safe }}
            </div>
        </div>
    </div>

    <div class="actions">
        <button type="submit" class="primary">Save now</button>
        <button type="button"
                class="danger"
                hx-post="/admin/pages/{{ id }}/delete"
                hx-include="[name=csrf_token]"
                hx-confirm="Delete this page?">
            Delete
        </button>
    </div>
</form>
{% endblock %}
