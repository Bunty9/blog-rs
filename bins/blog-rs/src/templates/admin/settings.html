{% extends "admin/base.html" %}
{% block title %}Settings · blog-rs{% endblock %}
{% block flash %}{% include "admin/partials/flash.html" %}{% endblock %}
{% block content %}
<h2>Settings</h2>

<form method="post" action="/admin/settings" style="max-width:600px;">
    <input type="hidden" name="csrf_token" value="{{ csrf }}" />

    <h3>Site</h3>
    <div class="field">
        <label for="site_title">Site title</label>
        <input id="site_title" name="site_title" type="text" value="{{ site_title }}" />
    </div>
    <div class="field">
        <label for="site_subtitle">Site subtitle</label>
        <input id="site_subtitle" name="site_subtitle" type="text" value="{{ site_subtitle }}" />
    </div>
    <div class="field">
        <label for="site_url">Site URL</label>
        <input id="site_url" name="site_url" type="text" value="{{ site_url }}" />
    </div>
    <div class="field">
        <label for="default_author_email">Default author email</label>
        <input id="default_author_email" name="default_author_email" type="email" value="{{ default_author_email }}" />
    </div>

    <h3>SMTP</h3>
    <div class="field">
        <label for="smtp_host">Host</label>
        <input id="smtp_host" name="smtp_host" type="text" value="{{ smtp_host }}" />
    </div>
    <div class="field">
        <label for="smtp_port">Port</label>
        <input id="smtp_port" name="smtp_port" type="number" value="{{ smtp_port }}" />
    </div>
    <div class="field">
        <label for="smtp_user">Username</label>
        <input id="smtp_user" name="smtp_user" type="text" value="{{ smtp_user }}" />
    </div>
    <div class="field">
        <label for="smtp_password">Password</label>
        <input id="smtp_password" name="smtp_password" type="password" value="{{ smtp_password }}" />
    </div>
    <div class="field">
        <label for="smtp_from">From address</label>
        <input id="smtp_from" name="smtp_from" type="email" value="{{ smtp_from }}" />
    </div>

    <div class="actions">
        <button type="submit" class="primary">Save settings</button>
    </div>
</form>
{% endblock %}
