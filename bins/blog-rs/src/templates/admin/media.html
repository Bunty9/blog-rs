{% extends "admin/base.html" %}
{% block title %}Media · blog-rs{% endblock %}

{% block content %}

<style>
.media-toolbar { display: flex; flex-wrap: wrap; gap: var(--space-3); align-items: center; margin-bottom: var(--space-4); }
.media-upload { display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3); border: 1.5px dashed var(--border-strong); border-radius: var(--r-md); padding: var(--space-4); margin-bottom: var(--space-5); }
.media-upload .meta { flex: 1 1 auto; }
.media-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: var(--space-3); }
.media-item { border: 1px solid var(--border); border-radius: var(--r-md); overflow: hidden; background: var(--bg); }
.media-item img { aspect-ratio: 4/3; object-fit: cover; width: 100%; display: block; background: var(--surface-2); }
.media-item .mi-body { padding: var(--space-3); display: flex; flex-direction: column; gap: var(--space-2); }
.media-item .mi-name { font-family: var(--font-mono); font-size: 0.72rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.media-item .mi-meta { font-size: 0.7rem; color: var(--text-muted); }
.media-item .mi-row { display: flex; gap: 4px; }
.media-item .mi-row .input { font-size: 0.7rem; padding: 4px 6px; }
.media-empty { display: flex; flex-direction: column; align-items: center; justify-content: center; padding: var(--space-9) var(--space-6); text-align: center; color: var(--text-muted); gap: var(--space-3); }
.media-empty svg { opacity: .35; }
.media-empty p { max-width: 380px; font-size: 0.9rem; line-height: 1.6; }
</style>

{% include "admin/partials/flash.html" %}

<form class="media-upload"
      hx-post="/admin/media"
      hx-encoding="multipart/form-data"
      hx-target="#media-items"
      hx-swap="innerHTML">
    <input class="input" type="file" name="file" accept="image/png,image/jpeg,image/gif,image/webp" required />
    <button type="submit" class="btn btn-primary btn-sm">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 16V4M5 11l7-7 7 7M5 20h14"/></svg>
        Upload
    </button>
    <span class="meta">PNG, JPEG, GIF, or WebP · max 10 MB</span>
</form>

<div class="media-grid" id="media-items">
    {% include "admin/partials/media_items.html" %}
</div>

{% endblock %}
