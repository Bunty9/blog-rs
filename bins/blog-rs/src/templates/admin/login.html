<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in — blog-rs admin</title>
    <script>(function(){var t=localStorage.getItem('blogrs-theme');document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();</script>
    <link rel="stylesheet" href="/assets/reader/base.css" />
    <link rel="stylesheet" href="/assets/reader/components.css" />
    <script src="/assets/reader/app.js" defer></script>
    <style>
        .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
        .login-card { max-width: 380px; width: 100%; }
        .login-card .lc-brand { display: flex; align-items: center; gap: var(--space-2); justify-content: center; margin-bottom: var(--space-6); }
        .login-card .lc-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
        .login-card .lc-brand span { font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; }
        .login-box { border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--space-7); background: var(--bg); }
        .login-box h1 { font-size: 1.3rem; text-align: center; margin-bottom: var(--space-5); }
        .login-err { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-3); border-radius: var(--r-md); background: var(--danger-subtle); border: 1px solid var(--danger); color: var(--danger); font-size: 0.85rem; margin-bottom: var(--space-4); }
        .login-foot { text-align: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-top: var(--space-5); }
        .theme-fab { position: fixed; top: var(--space-4); right: var(--space-4); }
    </style>
</head>
<body>
<button class="icon-btn theme-fab" aria-label="Toggle theme" onclick="toggleTheme()">
    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
</button>
<main class="login-wrap">
    <div class="login-card">
        <div class="lc-brand"><span class="dot"></span><span>blog-rs</span></div>
        <div class="login-box">
            <h1>Sign in</h1>
            {% if let Some(msg) = error %}
            <div class="login-err" role="alert">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg>
                {{ msg }}
            </div>
            {% endif %}
            <form id="login-form" onsubmit="doLogin(event)">
                <div class="field">
                    <label for="email">Email</label>
                    <input class="input" id="email" name="email" type="email" autocomplete="username" required />
                </div>
                <div class="field">
                    <label for="pw">Password</label>
                    <input class="input" id="pw" name="password" type="password" placeholder="••••••••" autocomplete="current-password" required />
                </div>
                <button class="btn btn-primary" id="submit-btn" type="submit" style="width:100%">Sign in</button>
            </form>
        </div>
        <div class="login-foot">single admin · session cookie · CSRF-protected</div>
    </div>
</main>
<script>
function doLogin(e) {
    e.preventDefault();
    var btn = document.getElementById('submit-btn');
    var email = document.getElementById('email').value;
    var password = document.getElementById('pw').value;
    btn.disabled = true;
    btn.textContent = 'Signing in…';
    fetch('/admin/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email: email, password: password }),
        credentials: 'same-origin'
    })
    .then(function(res) {
        if (res.ok) {
            window.location.href = '/admin';
        } else {
            showErr('Invalid credentials.');
            btn.disabled = false;
            btn.textContent = 'Sign in';
        }
    })
    .catch(function() {
        showErr('Network error — please try again.');
        btn.disabled = false;
        btn.textContent = 'Sign in';
    });
}
function showErr(msg) {
    var existing = document.querySelector('.login-err');
    if (existing) {
        // Find the last text node and update it, or fall back to setting innerText on the container
        var nodes = existing.childNodes;
        var textNode = null;
        for (var i = nodes.length - 1; i >= 0; i--) {
            if (nodes[i].nodeType === Node.TEXT_NODE) { textNode = nodes[i]; break; }
        }
        if (textNode) { textNode.nodeValue = ' ' + msg; } else { existing.lastChild.textContent = msg; }
        return;
    }
    var div = document.createElement('div');
    div.className = 'login-err';
    div.setAttribute('role', 'alert');
    var icon = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    icon.setAttribute('width', '16'); icon.setAttribute('height', '16');
    icon.setAttribute('viewBox', '0 0 24 24'); icon.setAttribute('fill', 'none');
    icon.setAttribute('stroke', 'currentColor'); icon.setAttribute('stroke-width', '2');
    icon.innerHTML = '<circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/>';
    var txt = document.createTextNode(' ' + msg);
    div.appendChild(icon);
    div.appendChild(txt);
    document.getElementById('login-form').insertAdjacentElement('beforebegin', div);
}
</script>
</body>
</html>
