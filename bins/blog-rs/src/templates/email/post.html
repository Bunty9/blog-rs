<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>{{ post_title }}</title>
</head>
<body style="margin:0;padding:0;background:#f6f7f9;font-family:Georgia,'Times New Roman',serif;color:#222;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" border="0" style="background:#f6f7f9;">
  <tr>
    <td align="center" style="padding:32px 16px;">
      <table role="presentation" width="640" cellpadding="0" cellspacing="0" border="0" style="background:#ffffff;border-radius:8px;">
        <tr>
          <td style="padding:32px;">
            <p style="margin:0 0 8px;font-size:12px;letter-spacing:0.08em;text-transform:uppercase;color:#888;">
              {{ site_title }}
            </p>
            <h1 style="margin:0 0 8px;font-size:26px;line-height:1.25;color:#111;">{{ post_title }}</h1>
            {% if let Some(s) = subtitle %}
            <p style="margin:0 0 24px;font-size:16px;color:#555;line-height:1.4;">{{ s }}</p>
            {% endif %}
            {% if let Some(e) = excerpt %}
            <p style="margin:0 0 24px;font-size:16px;line-height:1.6;">{{ e }}</p>
            {% endif %}
            <p style="margin:24px 0;">
              <a href="{{ post_url }}"
                 style="display:inline-block;padding:12px 20px;background:#111;color:#ffffff;text-decoration:none;border-radius:6px;font-weight:600;">
                Read the full post
              </a>
            </p>
            <hr style="border:none;border-top:1px solid #eee;margin:32px 0 16px;" />
            <p style="margin:0;font-size:12px;color:#888;line-height:1.5;">
              You're getting this because you subscribed at {{ site_title }}.
              <a href="{{ unsubscribe_url }}" style="color:#888;">Unsubscribe</a>.
            </p>
          </td>
        </tr>
      </table>
    </td>
  </tr>
</table>
</body>
</html>
