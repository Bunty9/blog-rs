<article class="post-card">
<a class="post-card-link" href="/posts/{{ post.slug }}">
<h2 class="post-card-title">{{ post.title }}</h2>
{% if let Some(sub) = post.subtitle %}<p class="post-card-subtitle">{{ sub }}</p>{% endif %}
{% if let Some(ex) = post.excerpt %}<p class="post-card-excerpt">{{ ex }}</p>{% endif %}
<p class="post-card-meta">
{% if let Some(d) = post.published_date %}<time datetime="{{ d }}">{{ d }}</time>{% endif %}
{% if let Some(m) = post.reading_minutes %}<span> · {{ m }} min read</span>{% endif %}
</p>
</a>
</article>
