<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in — blog-rs admin</title>
  <script>(function(){var t=localStorage.getItem('blogrs-theme');document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();</script>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <style>
    .login-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: var(--space-5); }
    .login-card { max-width: 380px; width: 100%; }
    .login-card .lc-brand { display: flex; align-items: center; gap: var(--space-2); justify-content: center; margin-bottom: var(--space-6); }
    .login-card .lc-brand .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--accent); }
    .login-card .lc-brand span { font-family: var(--font-mono); font-weight: 600; font-size: 1.1rem; }
    .login-box { border: 1px solid var(--border); border-radius: var(--r-lg); padding: var(--space-7); background: var(--bg); }
    .login-box h1 { font-size: 1.3rem; text-align: center; margin-bottom: var(--space-5); }
    .login-err { display: flex; gap: var(--space-2); align-items: center; padding: var(--space-3); border-radius: var(--r-md); background: var(--danger-subtle); border: 1px solid var(--danger); color: var(--danger); font-size: 0.85rem; margin-bottom: var(--space-4); }
    .login-foot { text-align: center; font-family: var(--font-mono); font-size: 0.72rem; color: var(--text-muted); margin-top: var(--space-5); }
    .theme-fab { position: fixed; top: var(--space-4); right: var(--space-4); }
  </style>
</head>
<body>
  <button class="icon-btn theme-fab" aria-label="Toggle theme" onclick="toggleTheme()"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg></button>
  <main class="login-wrap">
    <div class="login-card">
      <div class="lc-brand"><span class="dot"></span><span>blog-rs</span></div>
      <div class="login-box">
        <h1>Sign in</h1>
        <div class="login-err" id="err" style="display:none"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></svg> Invalid credentials.</div>
        <form id="login" onsubmit="event.preventDefault(); go(this)">
          <div class="field"><label for="email">Email</label><input class="input" id="email" type="email" value="admin@blog-rs.dev" required /></div>
          <div class="field"><label for="pw">Password</label><input class="input" id="pw" type="password" placeholder="••••••••" required /></div>
          <input type="hidden" name="csrf" value="•••" />
          <button class="btn btn-primary" type="submit" style="width:100%">Sign in</button>
        </form>
      </div>
      <div class="login-foot">single admin · session cookie · CSRF-protected</div>
    </div>
  </main>
  <script src="../assets/js/app.js"></script>
  <script>
    function go(form){
      var btn = form.querySelector('button');
      var pw = document.getElementById('pw').value;
      btn.classList.add('is-loading'); btn.innerHTML = '<span class="spinner"></span> Signing in…';
      setTimeout(function(){
        if(pw.length < 4){
          document.getElementById('err').style.display='flex';
          btn.classList.remove('is-loading'); btn.textContent='Sign in';
        } else {
          window.location.href = 'dashboard.html';
        }
      }, 800);
    }
  </script>
</body>
</html>
