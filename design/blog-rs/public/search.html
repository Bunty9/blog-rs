<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search — blog-rs</title>
  <script>(function(){var t=localStorage.getItem('blogrs-theme');document.documentElement.setAttribute('data-theme',t||(matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'));})();</script>
  <link rel="stylesheet" href="../assets/css/base.css" />
  <link rel="stylesheet" href="../assets/css/components.css" />
  <style>
    .search-page { max-width: 640px; margin-inline: auto; padding-top: var(--space-8); }
    .search-page h1 { font-size: 1.6rem; margin-bottom: var(--space-4); }
    .search-hint { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); margin-top: var(--space-3); display: flex; gap: var(--space-3); }
    .search-hint kbd { font-family: var(--font-mono); background: var(--surface-2); border: 1px solid var(--border); border-radius: var(--r-sm); padding: 1px 6px; font-size: 0.72rem; }
    .results-meta { font-family: var(--font-mono); font-size: 0.78rem; color: var(--text-muted); margin: var(--space-5) 0 var(--space-3); }
    .skel-result { height: 64px; border-radius: var(--r-md); background: linear-gradient(90deg, var(--surface) 25%, var(--surface-2) 50%, var(--surface) 75%); background-size: 200% 100%; animation: shimmer 1.4s infinite; margin-bottom: var(--space-2); }
  </style>
</head>
<body data-chrome data-base="../">
  <div data-chrome-header></div>
  <main id="main" class="container">
    <div class="search-page">
      <h1>Search</h1>
      <div class="search-box">
        <span class="s-icon"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></span>
        <input type="search" id="q" placeholder="Search posts… (try “async” or “alloc”)" autocomplete="off" autofocus />
      </div>
      <div class="search-hint"><span><kbd>↑</kbd><kbd>↓</kbd> navigate</span><span><kbd>↵</kbd> open</span><span>FTS5 · debounced 200ms</span></div>

      <div id="results-meta" class="results-meta hide"></div>
      <div class="search-results" id="results"></div>
      <div id="empty-default">
        <div class="results-meta">Recent</div>
        <div class="search-results">
          <a class="search-result" href="post.html"><strong>Building a zero-copy log parser in Rust</strong><div class="meta" style="margin-top:4px">9 min read · rust, performance</div></a>
          <a class="search-result" href="post.html"><strong>The cost of a syscall, measured</strong><div class="meta" style="margin-top:4px">8 min read · perf, linux</div></a>
          <a class="search-result" href="post.html"><strong>From zero to a working allocator</strong><div class="meta" style="margin-top:4px">11 min read · systems</div></a>
        </div>
      </div>
    </div>
  </main>
  <div data-chrome-footer></div>
  <script src="../assets/js/app.js"></script>
  <script src="../assets/js/chrome.js"></script>
  <script>
    var DATA = [
      {t:'Building a zero-copy log parser in Rust', m:'9 min read · rust, performance', s:'mmap ring buffer parse allocation'},
      {t:'The cost of a syscall, measured', m:'8 min read · perf, linux', s:'syscall vdso clock_gettime getpid'},
      {t:'From zero to a working allocator', m:'11 min read · systems', s:'alloc bump free-list buddy malloc'},
      {t:'Async cancellation, done right', m:'5 min read · async, rust', s:'async drop cancellation tokio await'},
      {t:'Notes on the borrow checker', m:'6 min read · rust', s:'borrow checker ownership lifetime'},
      {t:'Profiling async runtimes', m:'9 min read · async, perf', s:'async profiling tokio-console tracing perf'},
      {t:'Zero-downtime deploys with systemd', m:'4 min read · ops, linux', s:'systemd socket activation deploy'},
      {t:'A cooperative scheduler in safe Rust', m:'14 min read · systems', s:'scheduler generators wakers run loop'}
    ];
    var q = document.getElementById('q'), out = document.getElementById('results'), meta = document.getElementById('results-meta'), def = document.getElementById('empty-default');
    var idx = 0, deb;
    function esc(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
    function search(query){
      var ql = query.trim().toLowerCase();
      if(!ql){ def.classList.remove('hide'); meta.classList.add('hide'); out.innerHTML=''; return; }
      def.classList.add('hide');
      // loading skeleton
      meta.classList.remove('hide'); meta.textContent='Searching…';
      out.innerHTML = '<div class="skel-result"></div><div class="skel-result"></div>';
      setTimeout(function(){
        var hits = DATA.filter(function(d){ return (d.t+' '+d.s).toLowerCase().indexOf(ql) > -1; });
        if(!hits.length){ meta.textContent=''; out.innerHTML = '<div class="empty-state"><div class="es-icon"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5"><circle cx="11" cy="11" r="7"/><path d="M21 21l-4.3-4.3"/></svg></div><h3 style="font-size:1.1rem">No matches for “'+query+'”</h3><p>Try a broader term or browse <a href="tags.html" style="color:var(--accent)">all tags</a>.</p></div>'; return; }
        meta.textContent = hits.length + (hits.length===1?' result':' results') + ' for “'+query+'”';
        idx = 0;
        var re = new RegExp('('+esc(ql)+')','ig');
        out.innerHTML = hits.map(function(d,i){
          return '<a class="search-result'+(i===0?' kbd-active':'')+'" href="post.html"><strong>'+d.t.replace(re,'<mark>$1</mark>')+'</strong><div class="meta" style="margin-top:4px">'+d.m+'</div></a>';
        }).join('');
      }, 260);
    }
    q.addEventListener('input', function(){ clearTimeout(deb); deb=setTimeout(function(){ search(q.value); }, 200); });
    q.addEventListener('keydown', function(e){
      var items = out.querySelectorAll('.search-result'); if(!items.length) return;
      if(e.key==='ArrowDown'){ e.preventDefault(); idx=Math.min(idx+1,items.length-1); }
      else if(e.key==='ArrowUp'){ e.preventDefault(); idx=Math.max(idx-1,0); }
      else if(e.key==='Enter'){ if(items[idx]) items[idx].click(); return; }
      else return;
      items.forEach(function(it,i){ it.classList.toggle('kbd-active', i===idx); });
    });
  </script>
</body>
</html>
